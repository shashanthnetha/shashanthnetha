<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shashanth Netha — AI and Systems Engineer">
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a634" stop-opacity="0"/>
      <stop offset="15%" stop-color="#e8a634" stop-opacity="1"/>
      <stop offset="85%" stop-color="#e8a634" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8a634" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="subtleFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="840" height="240" rx="12" fill="url(#subtleFade)"/>
  <rect width="840" height="240" rx="12" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Accent line — animates in from center -->
  <line x1="60" y1="1" x2="780" y2="1" stroke="url(#accentLine)" stroke-width="2" stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" from="720" to="0" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>

  <!-- Name -->
  <text x="60" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#ededed" letter-spacing="-0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    Shashanth Netha
  </text>

  <!-- Role -->
  <text x="60" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#737373" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    AI &amp; Systems Engineer · Building local-first inference on Apple Silicon
  </text>

  <!-- Divider -->
  <line x1="60" y1="132" x2="200" y2="132" stroke="#262626" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
  </line>

  <!-- Details row -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>

    <text x="60" y="162" fill="#525252">CMRCET Hyderabad</text>
    <circle cx="188" cy="158" r="1.5" fill="#404040"/>
    <text x="198" y="162" fill="#525252">NxtWave CCBP 4.0</text>
    <circle cx="332" cy="158" r="1.5" fill="#404040"/>
    <text x="342" y="162" fill="#e8a634">★ 1st Place — IIT Hyderabad</text>
  </g>

  <!-- Links row -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>

    <text x="60" y="198" fill="#525252">portfolio</text>
    <circle cx="120" cy="194" r="1.5" fill="#404040"/>
    <text x="130" y="198" fill="#525252">linkedin</text>
    <circle cx="186" cy="194" r="1.5" fill="#404040"/>
    <text x="196" y="198" fill="#525252">github.com/shashanthnetha</text>
  </g>

  <!-- Subtle bottom fade line -->
  <line x1="60" y1="220" x2="780" y2="220" stroke="#1a1a1a" stroke-width="0.5"/>
</svg>
