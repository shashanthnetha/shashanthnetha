<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering Specification No. US-2026-SHA-M3: Local-First AI and Procedural Graphics System">
  <defs>
    <clipPath id="sheet">
      <rect x="0" y="0" width="880" height="520" rx="2"/>
    </clipPath>
    <pattern id="bluegrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c8d8e8" stroke-width="0.4"/>
    </pattern>
  </defs>

  <g clip-path="url(#sheet)">
    <!-- Sheet background: warm engineering paper -->
    <rect width="880" height="520" fill="#f5f2eb"/>
    <rect width="880" height="520" fill="url(#bluegrid)" opacity="0.5"/>

    <!-- Outer drawing border (standard patent margin) -->
    <rect x="40" y="40" width="800" height="440" fill="none" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Title block (bottom-right, per patent drawing convention) -->
    <rect x="520" y="400" width="320" height="80" fill="none" stroke="#2c3e50" stroke-width="1.2"/>
    <line x1="520" y1="424" x2="840" y2="424" stroke="#2c3e50" stroke-width="0.8"/>
    <line x1="520" y1="448" x2="840" y2="448" stroke="#2c3e50" stroke-width="0.8"/>
    <line x1="520" y1="464" x2="840" y2="464" stroke="#2c3e50" stroke-width="0.8"/>
    <line x1="680" y1="400" x2="680" y2="480" stroke="#2c3e50" stroke-width="0.8"/>

    <text x="536" y="416" font-family="'Times New Roman',Georgia,serif" font-size="10" fill="#2c3e50">INVENTOR</text>
    <text x="696" y="416" font-family="'Times New Roman',Georgia,serif" font-size="10" fill="#2c3e50">SPECIFICATION NO.</text>
    <text x="536" y="442" font-family="'Times New Roman',Georgia,serif" font-size="13" font-weight="700" fill="#1a1a1a">SHASHANTH NETHA</text>
    <text x="696" y="442" font-family="'Times New Roman',Georgia,serif" font-size="13" font-weight="700" fill="#1a1a1a">US-2026-SHA-M3</text>
    <text x="536" y="460" font-family="'Times New Roman',Georgia,serif" font-size="9" fill="#5a6a7a">CMRCET, Hyderabad · NxtWave CCBP 4.0</text>
    <text x="696" y="460" font-family="'Times New Roman',Georgia,serif" font-size="9" fill="#5a6a7a">Filed: Jan 2025</text>
    <text x="536" y="476" font-family="'Times New Roman',Georgia,serif" font-size="9" fill="#5a6a7a">Apple Silicon M3 · macOS · zsh</text>
    <text x="696" y="476" font-family="'Times New Roman',Georgia,serif" font-size="9" fill="#5a6a7a">Sheet 1 of 2</text>

    <!-- Figure label -->
    <text x="440" y="72" text-anchor="middle" font-family="'Times New Roman',Georgia,serif" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="2">FIG. 1 — SYSTEM ARCHITECTURE</text>

    <!-- =========================================================== -->
    <!-- SCHEMATIC: Three-module system architecture diagram           -->
    <!-- Each module is a labeled box with leader callout numbers     -->
    <!-- =========================================================== -->

    <!-- Module [10]: AI / ML Inference Engine -->
    <rect x="80" y="120" width="220" height="110" rx="3" fill="none" stroke="#2c3e50" stroke-width="1.2"/>
    <text x="90" y="142" font-family="'Times New Roman',Georgia,serif" font-size="12" font-weight="700" fill="#1a1a1a">[10] AI / ML INFERENCE ENGINE</text>
    <line x1="90" y1="148" x2="280" y2="148" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="90" y="166" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">PyTorch (MPS / Metal)</text>
    <text x="90" y="182" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">Gemini 2.0 Flash / Vision</text>
    <text x="90" y="198" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">ChromaDB · LangChain</text>
    <text x="90" y="214" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">OpenCV · DETR · YOLO</text>

    <!-- Module [20]: Procedural Graphics Engine -->
    <rect x="340" y="120" width="220" height="110" rx="3" fill="none" stroke="#2c3e50" stroke-width="1.2"/>
    <text x="350" y="142" font-family="'Times New Roman',Georgia,serif" font-size="12" font-weight="700" fill="#1a1a1a">[20] PROCEDURAL GRAPHICS</text>
    <line x1="350" y1="148" x2="540" y2="148" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="350" y="166" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">analytics_shorts engine</text>
    <text x="350" y="182" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">SVG/Canvas vector pipeline</text>
    <text x="350" y="198" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">Zero generative models</text>
    <text x="350" y="214" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">macOS launchd scheduler</text>

    <!-- Module [30]: Full-Stack & Automation -->
    <rect x="600" y="120" width="220" height="110" rx="3" fill="none" stroke="#2c3e50" stroke-width="1.2"/>
    <text x="610" y="142" font-family="'Times New Roman',Georgia,serif" font-size="12" font-weight="700" fill="#1a1a1a">[30] WEB &amp; AUTOMATION</text>
    <line x1="610" y1="148" x2="800" y2="148" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="610" y="166" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">Next.js 14 / FastAPI</text>
    <text x="610" y="182" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">Firebase Auth &amp; Firestore</text>
    <text x="610" y="198" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">n8n workflow automation</text>
    <text x="610" y="214" font-family="'Courier New',monospace" font-size="10" fill="#3a4a5a">Docker · GitHub Actions</text>

    <!-- Data flow arrows: [10] → [20] and [20] → [30] -->
    <line x1="300" y1="175" x2="340" y2="175" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="560" y1="175" x2="600" y2="175" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
      </marker>
    </defs>

    <!-- Flow labels -->
    <text x="320" y="168" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#7a8a9a">data</text>
    <text x="580" y="168" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#7a8a9a">deploy</text>

    <!-- =========================================================== -->
    <!-- EMBODIMENTS (shipped systems with reference numbers)         -->
    <!-- =========================================================== -->

    <text x="440" y="270" text-anchor="middle" font-family="'Times New Roman',Georgia,serif" font-size="12" font-weight="700" fill="#1a1a1a" letter-spacing="1.5">DETAILED DESCRIPTION OF EMBODIMENTS</text>

    <!-- Embodiment A -->
    <text x="80" y="298" font-family="'Times New Roman',Georgia,serif" font-size="11" fill="#1a1a1a"><tspan font-weight="700">A.</tspan> AgriSense AI — Multi-agent crop disease detection. Gemini Vision + ChromaDB + gTTS.</text>

    <!-- Embodiment B -->
    <text x="80" y="318" font-family="'Times New Roman',Georgia,serif" font-size="11" fill="#1a1a1a"><tspan font-weight="700">B.</tspan> analytics_shorts — Local procedural video engine. Zero generative models. Pure vector graphics.</text>

    <!-- Embodiment C -->
    <text x="80" y="338" font-family="'Times New Roman',Georgia,serif" font-size="11" fill="#1a1a1a"><tspan font-weight="700">C.</tspan> RumiCam — Real-time surveillance vision system. <tspan fill="#8b0000" font-weight="700">1st Place, IIT Hyderabad.</tspan></text>

    <!-- Embodiment D -->
    <text x="80" y="358" font-family="'Times New Roman',Georgia,serif" font-size="11" fill="#1a1a1a"><tspan font-weight="700">D.</tspan> IntelliCredit — 5-service AI credit appraisal. Random Forest + SHAP + Gemini Vision.</text>

    <!-- Embodiment E -->
    <text x="80" y="378" font-family="'Times New Roman',Georgia,serif" font-size="11" fill="#1a1a1a"><tspan font-weight="700">E.</tspan> courtroom-env — Legal argumentation environment for AI agents. 0.9667 baseline accuracy.</text>

    <!-- Red "Reduced to Practice" stamp — animated fade-in -->
    <g opacity="0" transform="translate(100, 388) rotate(-6)">
      <animate attributeName="opacity" from="0" to="0.7" begin="1.2s" dur="0.5s" fill="freeze"/>
      <rect x="0" y="0" width="240" height="36" rx="3" fill="none" stroke="#8b0000" stroke-width="2.5"/>
      <text x="120" y="24" text-anchor="middle" font-family="'Times New Roman',Georgia,serif" font-size="14" font-weight="700" fill="#8b0000" letter-spacing="3">REDUCED TO PRACTICE</text>
    </g>

    <!-- Animated dimension callout from [10] to bottom (measuring total system scope) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      <!-- Vertical dimension line on left margin -->
      <line x1="60" y1="120" x2="60" y2="380" stroke="#2c3e50" stroke-width="0.6"/>
      <line x1="56" y1="120" x2="64" y2="120" stroke="#2c3e50" stroke-width="0.6"/>
      <line x1="56" y1="380" x2="64" y2="380" stroke="#2c3e50" stroke-width="0.6"/>
      <text x="58" y="254" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#7a8a9a" transform="rotate(-90, 58, 254)">FULL SYSTEM SCOPE</text>
    </g>

  </g>
</svg>
