<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terminal boot animation introducing Shashanth Netha">
  <defs>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="318" rx="14"/>
    </clipPath>

    <!-- Typing animation clip path for 'whoami' -->
    <clipPath id="typeClip">
      <rect x="24" y="55" width="0" height="30">
        <animate attributeName="width" from="0" to="110" dur="0.75s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1.0"/>
      </rect>
    </clipPath>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Terminal Background Container -->
    <rect x="1" y="1" width="898" height="318" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

    <!-- Title Bar -->
    <rect x="1" y="1" width="898" height="34" fill="#161b22"/>
    <line x1="1" y1="35" x2="899" y2="35" stroke="#30363d" stroke-width="1"/>

    <!-- Window Buttons -->
    <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="18" r="6" fill="#27c93f"/>

    <text x="450" y="22" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8b949e">sha@macbook-m3 — zsh — 90x28</text>

    <!-- Terminal Body -->
    <g font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="16">

      <!-- Row 1: Typed prompt -->
      <text x="30" y="74" fill="#6e7681">$</text>
      <g clip-path="url(#typeClip)">
        <text x="46" y="74" fill="#c9d1d9" font-weight="500">whoami</text>
      </g>

      <!-- Row 2: Identity output -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="1.1s" dur="0.3s" fill="freeze"/>
        <text x="30" y="105" fill="#3fb950" font-weight="700">shashanth netha</text>
      </g>

      <!-- Row 3: Command about.log -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="1.5s" dur="0.3s" fill="freeze"/>
        <text x="30" y="136" fill="#6e7681">$ <tspan fill="#c9d1d9">cat about.log</tspan></text>
      </g>

      <!-- Row 4 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="1.9s" dur="0.3s" fill="freeze"/>
        <text x="30" y="167" fill="#3fb950">&gt; <tspan fill="#c9d1d9">B.Tech AI &amp; ML — CMRCET, Hyderabad</tspan></text>
      </g>

      <!-- Row 5 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="2.3s" dur="0.3s" fill="freeze"/>
        <text x="30" y="198" fill="#3fb950">&gt; <tspan fill="#c9d1d9">NxtWave CCBP 4.0 Fellow</tspan></text>
      </g>

      <!-- Row 6 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="2.7s" dur="0.3s" fill="freeze"/>
        <text x="30" y="229" fill="#3fb950">&gt; <tspan fill="#d29922">★</tspan> <tspan fill="#c9d1d9">1st place — IIT Hyderabad Hackathon</tspan></text>
      </g>

      <!-- Row 7 -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="3.1s" dur="0.3s" fill="freeze"/>
        <text x="30" y="260" fill="#3fb950">&gt; <tspan fill="#c9d1d9">shipping AgriSense AI &amp; analytics_shorts on an M3</tspan></text>
      </g>

      <!-- Row 8: Closing prompt + blinking cursor -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="3.5s" dur="0.3s" fill="freeze"/>
        <text x="30" y="291" fill="#6e7681">$</text>
        <rect x="46" y="276" width="9" height="18" rx="1" fill="#3fb950">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" begin="3.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Subtle texture overlays -->
    <rect x="1" y="35" width="898" height="284" fill="url(#scanlines)"/>
    <rect x="1" y="1" width="898" height="318" fill="url(#vignette)"/>
  </g>
</svg>
